name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (EXE & Setup)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare External Binaries (FFmpeg, FFprobe, Chromaprint fpcalc)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries"

          Write-Host "Installing FFmpeg via Chocolatey..."
          choco install ffmpeg -y --no-progress
          $ffmpegExe = (Get-Command ffmpeg).Source
          $ffprobeExe = (Get-Command ffprobe).Source
          Write-Host "FFmpeg source: $ffmpegExe"
          Write-Host "FFprobe source: $ffprobeExe"
          Copy-Item $ffmpegExe -Destination "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item $ffprobeExe -Destination "src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe" -Force

          Write-Host "Downloading Chromaprint fpcalc 1.5.1..."
          Invoke-WebRequest -Uri "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip" -OutFile "chromaprint.zip"
          Expand-Archive -Path "chromaprint.zip" -DestinationPath "chromaprint_temp" -Force
          $fpcalcExe = (Get-ChildItem -Path "chromaprint_temp" -Recurse -Filter "fpcalc.exe" | Select-Object -First 1).FullName
          Write-Host "fpcalc source: $fpcalcExe"
          Copy-Item $fpcalcExe -Destination "src-tauri/binaries/fpcalc-x86_64-pc-windows-msvc.exe" -Force

          Remove-Item -Path "chromaprint.zip" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "chromaprint_temp" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Verifying bundled binaries in src-tauri/binaries:"
          Get-ChildItem -Path "src-tauri/binaries" | Select-Object Name, Length

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Desktop App (NSIS Installer & Standalone EXE)
        run: npx @tauri-apps/cli build

      - name: Collect Build Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-artifacts"
          # Raccogli installer NSIS (.exe)
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist-artifacts" -Force
          # Raccogli installer MSI (.msi)
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist-artifacts" -Force
          # Raccogli eseguibile diretto (.exe standalone)
          if (Test-Path "src-tauri/target/release/runtime-soundmaster-pro.exe") {
            Copy-Item "src-tauri/target/release/runtime-soundmaster-pro.exe" -Destination "dist-artifacts/Runtime-SoundMaster-Pro-standalone.exe" -Force
          }
          Write-Host "Collected artifacts in dist-artifacts:"
          Get-ChildItem -Path "dist-artifacts" | Select-Object Name, Length

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Runtime-SoundMaster-Pro-Windows-x64
          path: dist-artifacts/*
          retention-days: 30

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
