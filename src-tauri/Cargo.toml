[package]
name = "runtime-soundmaster-pro"
version = "0.5.18"
description = "Runtime SoundMaster Pro — Universal Radio Library Sanitizer"
authors = ["Simone Pizzi — Runtime Radio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "runtime_soundmaster_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite bundled staticamente — nessuna dipendenza di sistema
rusqlite = { version = "0.32", features = ["bundled"] }
# Runtime asincrono — usato solo per tokio::task::spawn_blocking:
# bastano le feature del runtime, non "full" (v0.5.16)
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
# Scansione ricorsiva del filesystem
walkdir = "2"
# Pattern matching per rilevamento file YouTube/non-conform
regex = "1"
# Hashing SHA-256 per rilevamento duplicati binari esatti
sha2 = "0.10"
lofty = "0.24.0"

